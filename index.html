<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <title>NutriCoach — acompanhamento de alunos</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">

<body>
  <header class="topbar">
    <button id="btn-back" class="ghost" aria-label="Voltar" hidden>‹</button>

  <main id="app"><!-- as telas são renderizadas aqui --></main>
